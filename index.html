<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0d0d1a 0%, #1a1a2e 50%, #0d0d1a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;

    h1 { font-size: 28px; margin-bottom: 10px; }
    h1 .accent { color: #4ade80; }
    .status { color: #888; margin-bottom: 30px; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #333;
      border-top-color: #4ade80;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .link {
      display: inline-block;
      padding: 14px 28px;
      background: #4ade80;
      color: #0d0d1a;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }
    .link:hover { background: #22c55e; }
    .manual { margin-top: 30px; color: #666; font-size: 12px; }
    .manual a { color: #4ade80; }
    .updated { margin-top: 20px; color: #555; font-size: 11px; }

</head>
